<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conferência">
<meta name="theme-color" content="#9E6A35">
<title>Conferência de prateleira</title>
<style>
:root{--bg:#F3F5F4;--surface:#fff;--ink:#18252A;--muted:#5A686E;--line:#D8DEDC;--kraft:#9E6A35;--kraft-soft:#F1E6D9;
  --ok:#2E7D4F;--ok-bg:#E3F2E8;--warn:#9A6A00;--warn-bg:#FBF0D2;--bad:#B03A2E;--bad-bg:#F8E1DE;--idle-bg:#E8ECEB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--kraft);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:18px;flex:1}
header a,header button{color:#fff;font:600 14px inherit;font-family:inherit;background:rgba(255,255,255,.18);border:0;border-radius:6px;padding:8px 10px;text-decoration:none;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
button{font:600 16px inherit;font-family:inherit;border-radius:8px;padding:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.pri{background:var(--kraft);border-color:var(--kraft);color:#fff}
button.zero{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
button:focus-visible,input:focus-visible{outline:3px solid var(--kraft);outline-offset:2px}
input{font:inherit;padding:14px;border:1px solid var(--line);border-radius:8px;width:100%;background:var(--surface);color:var(--ink)}
#leitor{width:100%;background:#000;border-radius:8px;overflow:hidden;min-height:0}
#leitor video{display:block;width:100%!important}
.linha{display:flex;gap:8px}
.linha input{flex:1;min-width:0}
.aviso{border-radius:8px;padding:12px;font-size:15px}
.a-warn{background:var(--warn-bg);color:var(--warn)}.a-bad{background:var(--bad-bg);color:var(--bad)}.a-ok{background:var(--ok-bg);color:var(--ok)}
.cartao{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--kraft);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.cartao h2{margin:0;font-size:19px;line-height:1.25}
.cartao .cod{color:var(--muted);font:13px ui-monospace,Menlo,Consolas,monospace}
dialog#d-novo{width:100vw;max-width:100vw;height:100vh;max-height:100vh;border:0;padding:0;background:var(--bg);color:var(--ink)}
dialog#d-novo::backdrop{background:rgba(0,0,0,.5)}
.topo-n{position:sticky;top:0;z-index:2;background:var(--kraft);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));font-size:19px;font-weight:700}
.corpo-n{padding:14px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto}
.campo{display:block;font-weight:600;margin:8px 0 0}
.campo input,.campo select{margin-top:5px;font-weight:400}
.campo input[readonly]{background:var(--idle-bg);font-family:ui-monospace,Menlo,Consolas,monospace}
#n-foto-prev{display:flex;gap:12px;align-items:center}
details.mais{margin-top:8px}
details.mais summary{cursor:pointer;font-weight:600;padding:8px 0}
.dois-n{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}
.dois-n button{padding:18px;font-size:18px}
select{font:inherit;padding:14px;border:1px solid var(--line);border-radius:8px;width:100%;background:var(--surface);color:var(--ink)}
.topo-cartao{display:flex;gap:12px;align-items:flex-start}
.topo-cartao>div:last-child{min-width:0;flex:1}
.foto-c{width:104px;height:104px;border-radius:12px;object-fit:cover;flex:none;background:var(--idle-bg);cursor:zoom-in;display:block}
.foto-c.sem{display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--muted);border:2px dashed var(--line);cursor:default;padding:6px}
.btn-foto.destaque{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-size:18px;padding:16px}
#foto-msg{font-size:14px;color:var(--muted);margin-top:6px}
dialog#d-zoom{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh}
dialog#d-zoom::backdrop{background:rgba(0,0,0,.8)}
dialog#d-zoom img{display:block;max-width:96vw;max-height:92vh;border-radius:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px}
.p-ok{color:var(--ok);background:var(--ok-bg)}.p-bad{color:var(--bad);background:var(--bad-bg)}.p-idle{color:var(--muted);background:var(--idle-bg)}
.qtd{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.qtd input{text-align:center;font:700 26px ui-monospace,Menlo,Consolas,monospace;padding:10px}
.qtd button{font-size:24px;padding:0}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.escolha{display:flex;flex-direction:column;gap:8px}
.escolha button{text-align:left;font-weight:500}
.escolha small{display:block;color:var(--muted)}
h3{margin:6px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
li{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;font-size:14px}
li:last-child{border-bottom:0}
li b{font:700 16px ui-monospace,Menlo,Consolas,monospace;min-width:44px;text-align:right}
li span{flex:1;min-width:0;overflow-wrap:anywhere}
li small{color:var(--muted);white-space:nowrap}
#caixa{position:relative}
.mira{position:absolute;left:6%;right:6%;top:50%;height:0;border-top:2px solid rgba(255,60,60,.9);pointer-events:none}
.status{border-radius:8px;padding:11px 13px;font-size:15px;background:var(--idle-bg);color:var(--ink)}
.status.aviso{background:var(--warn-bg);color:var(--warn)}
.btn-foto{display:block;text-align:center;font:600 16px inherit;font-family:inherit;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.btn-foto:focus-within{outline:3px solid var(--kraft);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Conferência</h1><button id="b-quem"></button><a href="/">Painel</a></header>
<main>
  <div id="caixa" hidden><div id="leitor"></div><div class="mira"></div></div>
  <div id="cam-status" class="status" hidden role="status"></div>
  <div id="cam-msg" class="aviso a-warn" hidden></div>
  <button class="pri" id="b-cam">Abrir a câmera para bipar</button>
  <label class="btn-foto" for="f-foto">📷 Tirar foto do código<input type="file" id="f-foto" accept="image/*" capture="environment" hidden></label>
  <div id="leitor-arq" hidden></div>
  <form class="linha" id="f-cod">
    <input id="cod" inputmode="search" autocomplete="off" placeholder="Código de barras ou nome do produto" aria-label="Código de barras ou nome do produto">
    <button>Buscar</button>
  </form>
  <div id="resultado" aria-live="polite"></div>
  <h3>Últimas contagens <span id="tot"></span></h3>
  <ul id="ultimas"></ul>
</main>

<dialog id="d-novo"><div class="topo-n">Cadastrar produto</div><div class="corpo-n" id="n-corpo"></div></dialog>
<dialog id="d-zoom"><img id="z-img" alt=""></dialog>
<script src="/vendor/html5-qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mini = (u, t) => u && /-\d+-\d+\.\w+$/.test(u) ? u.replace(/-\d+-\d+(\.\w+)$/, "-" + t + "-0$1") : u;
const hora = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+" "+s.slice(11,16) : "";
async function api(url, opt){
  const r = await fetch(url, opt);
  if(r.status === 401){ location.href = "/login?ir=conferir"; throw new Error("login"); }
  const j = await r.json(); if(!r.ok) throw new Error(j.erro || "Erro"); return j;
}

// quem está contando (fica no histórico de cada produto)
let quem = "";
try{ quem = localStorage.getItem("quem") || ""; }catch(e){}
function mostrarQuem(){ $("#b-quem").textContent = quem || "Seu nome"; }
$("#b-quem").onclick = () => {
  const n = prompt("Quem está contando?", quem); if(n === null) return;
  quem = n.trim().slice(0, 40); try{ localStorage.setItem("quem", quem); }catch(e){} mostrarQuem();
};
mostrarQuem();

function bip(){
  try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
  try{
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 1200; g.gain.value = .08; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .09);
  }catch(e){}
}


// ------------------------------------------------------------------ fotos
async function reduzirFoto(file, lado){
  lado = lado || 1280;
  const url = URL.createObjectURL(file);
  try{
    const img = new Image(); img.src = url; await img.decode();
    const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error("Não consegui preparar a foto.")), "image/jpeg", 0.82));
  } finally { URL.revokeObjectURL(url); }
}
async function enviarFoto(id, file){
  let quem = ""; try{ quem = localStorage.getItem("quem") || ""; }catch(e){}
  const blob = await reduzirFoto(file);
  return api("/api/foto/" + id, {method:"POST", body: blob, headers:{"Content-Type":"image/jpeg", "X-Quem": encodeURIComponent(quem)}});
}

// ---------------------------------------------------------------- câmera
// Só aceita código com dígito verificador certo: leitura torta é ignorada em vez de buscar produto errado.
function gs1Ok(c){
  if(!/^\d+$/.test(c) || ![8, 12, 13, 14].includes(c.length)) return false;
  const n = c.length; let soma = 0;
  for(let i = 0; i < n - 1; i++) soma += (+c[n - 2 - i]) * (i % 2 === 0 ? 3 : 1);
  return (10 - soma % 10) % 10 === +c[n - 1];
}
function status(t, tipo){ const e = $("#cam-status"); e.hidden = !t; e.textContent = t || ""; e.className = "status" + (tipo ? " " + tipo : ""); }
function msgErro(e){
  const n = String((e && e.name) || ""), m = String((e && e.message) || e || ""), tudo = n + " " + m;
  if(/NotAllowed|Permission|denied/i.test(tudo)) return "O celular bloqueou a câmera para este endereço. No iPhone: toque em “aA” na barra de endereço do Safari, depois Ajustes do Site, Câmera e Permitir. Depois tente de novo.";
  if(/NotFound|no camera|Requested device/i.test(tudo)) return "Não encontrei uma câmera neste aparelho.";
  if(/NotReadable|TrackStart|in use|Could not start/i.test(tudo)) return "A câmera está em uso por outro aplicativo. Feche os outros apps e tente de novo.";
  return "Não consegui abrir a câmera (" + (n || m).slice(0, 80) + "). Use o botão “Tirar foto do código” ou digite o código.";
}
let leitor = null, lendo = false, ultimo = "", ultimoEm = 0, descartes = 0, dica = null;
const FORMATOS = () => { const F = Html5QrcodeSupportedFormats; return [F.EAN_13, F.EAN_8, F.UPC_A, F.ITF]; };
function onLido(texto){
  texto = String(texto).trim();
  if(!gs1Ok(texto)){
    if(++descartes >= 3) status("Estou vendo o código, mas ele sai errado (“" + texto + "”). Deixe o celular reto, bem de frente e com mais luz.", "aviso");
    return;
  }
  descartes = 0;
  const agora = Date.now();
  if(texto === ultimo && agora - ultimoEm < 4000) return;
  ultimo = texto; ultimoEm = agora; bip(); status("Código lido: " + texto); buscar(texto, true);
}
async function abrirCamera(){
  if(!window.isSecureContext){
    $("#cam-msg").hidden = false;
    $("#cam-msg").textContent = "O celular só libera a câmera em endereço com cadeado (https). Digite o código, tire uma foto ou use um leitor Bluetooth.";
    return;
  }
  $("#caixa").hidden = false; $("#cam-msg").hidden = true; descartes = 0;
  status("Abrindo a câmera… se o celular perguntar, toque em Permitir.");
  leitor = new Html5Qrcode("leitor", {formatsToSupport: FORMATOS(),
    experimentalFeatures:{useBarCodeDetectorIfSupported:true}, verbose:false});
  try{
    await leitor.start({facingMode:"environment"},
      {fps:10, disableFlip:true, videoConstraints:{facingMode:"environment", width:{ideal:1920}, height:{ideal:1080}}},
      onLido, () => {});
    lendo = true; $("#b-cam").textContent = "Fechar a câmera"; $("#b-cam").classList.remove("pri");
    let res = ""; try{ const st = leitor.getRunningTrackSettings(); res = " (" + st.width + "×" + st.height + ")"; }catch(e){}
    status("Câmera ligada" + res + ". Deixe as listras na horizontal, a uns 15 a 20 cm, com boa luz.");
    clearTimeout(dica);
    dica = setTimeout(() => { if(lendo && $("#caixa").hidden === false) status("Ainda não li nada. Afaste um pouco o celular até o código ficar nítido, ou use “Tirar foto do código”.", "aviso"); }, 12000);
  }catch(e){
    $("#caixa").hidden = true; leitor = null; status("");
    $("#cam-msg").hidden = false; $("#cam-msg").textContent = msgErro(e);
  }
}
async function fecharCamera(){
  clearTimeout(dica);
  if(leitor){ try{ await leitor.stop(); leitor.clear(); }catch(e){} }
  leitor = null; lendo = false; $("#caixa").hidden = true; status("");
  $("#b-cam").textContent = "Abrir a câmera para bipar"; $("#b-cam").classList.add("pri");
}
function pausar(sim){
  if(!leitor || !lendo) return;
  try{ sim ? leitor.pause(true) : leitor.resume(); }catch(e){}
  $("#caixa").hidden = sim;   // com o produto na tela, a câmera sai da frente
  if(!sim) window.scrollTo({top:0});
}
$("#b-cam").onclick = () => lendo ? fecharCamera() : abrirCamera();

// Plano B: foto tirada pela câmera do próprio celular (foca melhor que o vídeo ao vivo)
$("#f-foto").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  status("Lendo a foto…");
  const arq = new Html5Qrcode("leitor-arq", {formatsToSupport: FORMATOS(), experimentalFeatures:{useBarCodeDetectorIfSupported:true}, verbose:false});
  try{
    const t = String(await arq.scanFile(f, false)).trim();
    if(!gs1Ok(t)){ status("Li “" + t + "”, mas parece errado. Tire outra foto, mais de perto e com o código reto.", "aviso"); return; }
    bip(); status("Código lido: " + t); buscar(t, true);
  }catch(err){
    status("Não achei um código de barras na foto. Chegue mais perto, deixe as listras na horizontal e bem iluminadas.", "aviso");
  }finally{ try{ arq.clear(); }catch(x){} }
});


// ------------------------------------------------- cadastro na hora (código que não existe)
let gruposCache = null, fotoNova = null, cadastroSalvo = false, codigoCadastro = "";
async function carregarGrupos(){
  if(!gruposCache){ try{ gruposCache = (await api("/api/categorias")).itens; }catch(e){ gruposCache = []; } }
  return gruposCache;
}
async function abrirCadastro(codigo){
  const grupos = await carregarGrupos();
  fotoNova = null; cadastroSalvo = false; codigoCadastro = codigo;
  $("#n-corpo").innerHTML = `
    <div class="aviso a-warn">Este código não está no cadastro. Cadastre agora para não perder a contagem. O produto fica só no painel; depois é preciso cadastrar nas lojas.</div>
    <label class="campo">Código de barras<input id="n-ean" value="${esc(codigo)}" readonly></label>
    <label class="campo">Nome do produto *<input id="n-nome" autocomplete="off" autocapitalize="words" enterkeyhint="next" placeholder="Ex.: Sacola plástica 40x50"></label>
    <label class="campo">Categoria da loja<select id="n-cat"><option value="">— escolher —</option>${grupos.map(g => `<option value="${esc(g.id)}">${esc(g.nome)}</option>`).join("")}</select></label>
    ${grupos.length ? "" : '<div class="aviso a-warn">As categorias da loja aparecem depois de “Atualizar dados” no painel do computador.</div>'}
    <label class="campo">Preço de venda (R$)<input id="n-preco" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
    <label class="campo">Quantos tem na prateleira?<input id="n-qtd" type="number" inputmode="numeric" min="0" step="1" placeholder="Deixe vazio se não for contar agora"></label>
    <div id="n-foto-prev"><label class="btn-foto destaque" for="n-foto" style="flex:1">📷 Tirar foto do produto<input type="file" id="n-foto" accept="image/*" capture="environment" hidden></label></div>
    <details class="mais"><summary>Mais detalhes (custo, unidade, observação)</summary>
      <label class="campo">Custo (R$)<input id="n-custo" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
      <label class="campo">Unidade<select id="n-un"><option>UN</option><option>CX</option><option>PC</option><option>PCT</option><option>KG</option><option>M</option><option>L</option></select></label>
      <label class="campo">Observação<input id="n-obs" autocomplete="off"></label>
    </details>
    <div id="n-erro" class="aviso a-bad" hidden role="alert"></div>
    <div class="dois-n"><button id="n-agora">Agora não</button><button class="pri" id="n-salvar">Cadastrar</button></div>`;
  $("#n-foto").onchange = e => {
    const f = e.target.files[0]; e.target.value = ""; if(!f) return;
    fotoNova = f;
    $("#n-foto-prev").innerHTML = `<img class="foto-c" src="${URL.createObjectURL(f)}" alt="Foto tirada"><span>Foto pronta ✔</span>`;
  };
  $("#n-corpo").addEventListener("input", () => erroCadastro(""));
  $("#n-agora").onclick = () => $("#d-novo").close();
  $("#n-salvar").onclick = salvarCadastro;
  $("#d-novo").showModal();
  setTimeout(() => $("#n-nome").focus(), 150);
}
function erroCadastro(t){ const e = $("#n-erro"); e.hidden = !t; e.textContent = t || ""; if(t) e.scrollIntoView({block:"center"}); }
async function salvarCadastro(){
  const nome = $("#n-nome").value.trim();
  if(nome.length < 2){ erroCadastro("Escreva o nome do produto."); $("#n-nome").focus(); return; }
  const btn = $("#n-salvar"); btn.disabled = true; btn.textContent = "Salvando…"; erroCadastro("");
  const d = {ean: codigoCadastro, nome, categoria_id: $("#n-cat").value, preco: $("#n-preco").value.replace(",", "."),
             estoque: $("#n-qtd").value, custo: $("#n-custo").value.replace(",", "."), unidade: $("#n-un").value, obs: $("#n-obs").value.trim(), quem};
  try{
    let p = await api("/api/produto-novo", {method:"POST", body:JSON.stringify(d)});
    let aviso = "";
    if(fotoNova){ try{ p = await enviarFoto(p.id, fotoNova); }catch(e){ aviso = " (a foto não foi salva; tire de novo no cartão)"; } }
    cadastroSalvo = true; gruposCache = null; $("#d-novo").close();
    const msg = `<div class="aviso a-ok">Cadastrado ✔ <b>${esc(p.nome)}</b>${p.estoque != null ? " · contado: " + p.estoque : ""}. Fica só no painel; falta cadastrar nas lojas.${esc(aviso)}</div>`;
    ultimas();
    if(p.estoque != null){ $("#resultado").innerHTML = msg; seguir(); }
    else { cartao(p); $("#resultado").insertAdjacentHTML("afterbegin", msg); }
  }catch(e){ erroCadastro(e.message); btn.disabled = false; btn.textContent = "Cadastrar"; }
}
$("#d-novo").addEventListener("close", async () => {
  if(cadastroSalvo) return;                    // "Agora não" ou voltar: o código fica anotado
  try{ await api("/api/sem-cadastro", {method:"POST", body:JSON.stringify({codigo:codigoCadastro, quem, obs:""})}); }catch(e){}
  $("#resultado").innerHTML = `<div class="aviso a-warn">Anotado para cadastrar depois: <b>${esc(codigoCadastro)}</b></div>`;
  seguir();
});

// ------------------------------------------------------------------ busca
async function buscar(texto, daCamera){
  texto = String(texto).trim(); if(!texto) return;
  const res = $("#resultado");
  const soNumero = /^[\d\s.-]+$/.test(texto);
  let itens = [];
  try{
    if(soNumero) itens = (await api("/api/codigo?c=" + encodeURIComponent(texto))).itens;
    else itens = (await api("/api/produtos?por_pagina=12&q=" + encodeURIComponent(texto))).itens;
  }catch(e){ if(e.message !== "login") res.innerHTML = `<div class="aviso a-bad">${esc(e.message)}</div>`; return; }
  if(!itens.length){
    if(soNumero){ pausar(true); res.innerHTML = ""; abrirCadastro(texto.replace(/\D/g, "")); return; }   // código novo: abre o cadastro na hora
    res.innerHTML = `<div class="aviso a-warn">Nenhum produto com “${esc(texto)}”.</div>`;
    return;
  }
  if(itens.length === 1) return cartao(itens[0]);
  pausar(true);
  res.innerHTML = `<div class="aviso a-warn">${itens.length} produtos encontrados. Qual é?</div><div class="escolha" style="margin-top:8px">${
    itens.map((p, i) => `<button data-i="${i}">${esc(p.nome)}<small>${esc(p.ean || "sem código")}${p.estoque != null ? " · estoque " + p.estoque : ""}</small></button>`).join("")}</div>`;
  res.querySelectorAll("button").forEach(b => b.onclick = () => cartao(itens[b.dataset.i]));
}

const NOMES = {nuvemshop:"Site", ifood:"iFood", "99food":"99Food"};
function cartao(p){
  pausar(true);
  const pills = Object.keys(NOMES).map(c => {
    const cs = p.canais.filter(x => x.canal === c);
    if(!cs.length) return `<span class="pill p-idle">${NOMES[c]}: não está</span>`;
    const v = cs.some(x => x.vendendo);
    return `<span class="pill ${v ? "p-ok" : "p-bad"}">${NOMES[c]}: ${v ? "à venda" : "fora de venda"}</span>`;
  }).join("");
  $("#resultado").innerHTML = `<div class="cartao">
    <div class="topo-cartao"><div id="foto-img"></div><div>
      <h2>${esc(p.nome)}</h2>
      <div class="cod">${esc(p.ean || "sem código de barras")}${p.gz_codigo ? " · Gestor Z " + esc(p.gz_codigo) : ""}</div>
    </div></div>
    <div class="pills">${pills}</div>
    <div id="foto-acao"></div>
    <div>${p.estoque == null ? "Ainda não conferido." : `Última contagem: <b>${p.estoque}</b> em ${hora(p.conferido_em)}`}</div>
    <label for="qtd"><b>Quantos tem na prateleira?</b></label>
    <div class="qtd"><button type="button" id="menos" aria-label="Menos um">−</button>
      <input id="qtd" type="number" inputmode="numeric" min="0" step="1" value="${p.estoque ?? ""}">
      <button type="button" id="mais" aria-label="Mais um">+</button></div>
    <div class="dois"><button class="zero" id="b-zero">Não tem (0)</button><button class="pri" id="b-salvar">Salvar</button></div>
    <button id="b-pular">Pular sem salvar</button>
    <div id="c-erro" class="aviso a-bad" hidden></div>
  </div>`;
  desenharFoto(p);
  const q = $("#qtd");
  $("#menos").onclick = () => q.value = Math.max(0, (parseInt(q.value) || 0) - 1);
  $("#mais").onclick = () => q.value = (parseInt(q.value) || 0) + 1;
  const salvar = async valor => {
    if(valor === "" || isNaN(parseInt(valor)) || parseInt(valor) < 0){ $("#c-erro").hidden = false; $("#c-erro").textContent = "Digite a quantidade."; return; }
    try{
      await api("/api/produto/" + p.id, {method:"POST", body:JSON.stringify({estoque: parseInt(valor), quem})});
      $("#resultado").innerHTML = `<div class="aviso a-ok">Salvo: <b>${parseInt(valor)}</b> × ${esc(p.nome)}</div>`;
      ultimas(); seguir();
    }catch(e){ $("#c-erro").hidden = false; $("#c-erro").textContent = e.message; }
  };
  $("#b-salvar").onclick = () => salvar(q.value);
  $("#b-zero").onclick = () => salvar("0");
  $("#b-pular").onclick = () => { $("#resultado").innerHTML = ""; seguir(); };
  q.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); salvar(q.value); } });
  q.focus(); q.select();
}
function desenharFoto(p){
  const img = $("#foto-img"), acao = $("#foto-acao"); if(!img || !acao) return;
  img.innerHTML = p.foto ? `<img class="foto-c" src="${esc(mini(p.foto, 320))}" data-full="${esc(p.foto)}" alt="Foto de ${esc(p.nome)}">` : `<div class="foto-c sem">Sem foto</div>`;
  const el = img.querySelector("img");
  if(el) el.onclick = () => { $("#z-img").src = el.dataset.full; $("#d-zoom").showModal(); };
  const texto = p.foto_local ? "📷 Tirar outra foto" : (p.foto ? "📷 Tirar outra foto (a do site pode estar errada)" : "📷 Sem foto: tirar foto na prateleira");
  acao.innerHTML = `<label class="btn-foto ${p.foto ? "" : "destaque"}" for="f-prod">${texto}<input type="file" id="f-prod" accept="image/*" capture="environment" hidden></label><div id="foto-msg" role="status"></div>`;
  $("#f-prod").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if(!f) return;
    $("#foto-msg").textContent = "Enviando a foto…";
    try{
      const d = await enviarFoto(p.id, f);
      p.foto = d.foto; p.foto_local = true; desenharFoto(p);
      $("#foto-msg").textContent = "Foto salva ✔";
    }catch(err){
      $("#foto-msg").textContent = /Não encontrado/.test(err.message)
        ? "O painel no computador está desatualizado. Feche a janela preta do painel e abra o iniciar.bat de novo."
        : "Não consegui salvar a foto: " + err.message;
    }
  };
}
$("#d-zoom").addEventListener("click", () => $("#d-zoom").close());
function seguir(){
  pausar(false); ultimo = ""; $("#cod").value = "";
  if(!lendo) $("#cod").focus();   // leitor Bluetooth ou teclado: já fica pronto para o próximo
}
$("#f-cod").addEventListener("submit", e => { e.preventDefault(); buscar($("#cod").value); });

async function ultimas(){
  try{
    const r = await api("/api/conferidos");
    if(r.servidor !== "9") status("⚠️ O painel no computador está desatualizado. Feche a janela preta do painel e abra o iniciar.bat de novo.", "aviso");
    $("#tot").textContent = "· " + r.total + (r.total === 1 ? " produto já conferido" : " produtos já conferidos");
    $("#ultimas").innerHTML = r.itens.length ? r.itens.map(h =>
      `<li><b>${esc(h.para || "—")}</b><span>${esc(h.nome)}</span><small>${hora(h.quando)}${h.origem && h.origem !== "painel" ? " · " + esc(h.origem) : ""}</small></li>`).join("")
      : "<li><span>Nenhuma contagem ainda.</span></li>";
  }catch(e){}
}
ultimas();
</script>
